<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>window.connectElgatoStreamDeckSocket = (...args) => { window.earlyConnect = args; };</script>
  <title>Open Launcher</title>
  <link rel="stylesheet" href="pi.css">
</head>
<body>
  <div class="row">
    <label for="list">List</label>
    <select id="list" data-key="list">
      <option value="" data-fixed>default</option>
    </select>
  </div>
  <div class="row">
    <label for="color">Key color</label>
    <select id="color" data-key="color">
      <option value="">default: the list's color</option>
      <option value="grey">grey</option>
      <option value="blue">blue</option>
      <option value="red">red</option>
    </select>
  </div>
  <div class="row">
    <label></label>
    <div class="with-button"><button id="manager" type="button">Manage apps…</button></div>
  </div>
  <div class="info" id="info">Opens the Managed App Launcher profile on this deck with the chosen list.</div>

  <script src="pi.js"></script>
  <script>
    bindManagerButton("manager");
    onInfo = (info) => {
      const select = document.getElementById("list");
      select.querySelector("option[data-fixed]").textContent = info.homeName || "default";
      fillPresets(select, (info.lists || []).filter((l) => l.id !== info.homeList && !l.auto));
      document.getElementById("info").innerHTML = `config: <code>${escapeHtml(info.configPath)}</code>`;
    };
  </script>
</body>
</html>
